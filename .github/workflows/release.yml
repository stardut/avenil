name: Release macOS app

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build DMG
    runs-on: macos-15
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TAG_NAME: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Prepare release version
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const tag = process.env.TAG_NAME;
          const tagVersion = tag?.replace(/^v/, "");
          const semverPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;

          if (!tag || !semverPattern.test(tagVersion ?? "")) {
            throw new Error(`Release tags must use MAJOR.MINOR.PATCH with an optional v prefix: ${tag ?? "<missing>"}`);
          }

          const writeJson = (path, value) => {
            fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`, "utf8");
          };

          const packageJsonPath = "package.json";
          const packageLockPath = "package-lock.json";
          const tauriConfigPath = "src-tauri/tauri.conf.json";
          const cargoTomlPath = "src-tauri/Cargo.toml";
          const cargoLockPath = "src-tauri/Cargo.lock";

          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"));
          const packageLock = JSON.parse(fs.readFileSync(packageLockPath, "utf8"));
          const tauriConfig = JSON.parse(fs.readFileSync(tauriConfigPath, "utf8"));
          const cargoToml = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          const cargoLock = fs.readFileSync(cargoLockPath, "utf8");

          if (!packageLock.packages?.[""]) {
            throw new Error("package-lock.json is missing its root package entry.");
          }

          const cargoPackagePattern = /(\[package\][\s\S]*?^version\s*=\s*")[^"]+(")/m;
          if (!cargoPackagePattern.test(cargoToml)) {
            throw new Error("src-tauri/Cargo.toml is missing the package version.");
          }

          const cargoLockPackagePattern = /(\[\[package\]\]\s*name\s*=\s*"avenil"\s*version\s*=\s*")[^"]+(")/m;
          if (!cargoLockPackagePattern.test(cargoLock)) {
            throw new Error('src-tauri/Cargo.lock is missing the "avenil" package entry.');
          }

          packageJson.version = tagVersion;
          packageLock.version = tagVersion;
          packageLock.packages[""].version = tagVersion;
          tauriConfig.version = tagVersion;

          const updatedCargoToml = cargoToml.replace(cargoPackagePattern, `$1${tagVersion}$2`);
          const updatedCargoLock = cargoLock.replace(cargoLockPackagePattern, `$1${tagVersion}$2`);

          writeJson(packageJsonPath, packageJson);
          writeJson(packageLockPath, packageLock);
          writeJson(tauriConfigPath, tauriConfig);
          fs.writeFileSync(cargoTomlPath, updatedCargoToml, "utf8");
          fs.writeFileSync(cargoLockPath, updatedCargoLock, "utf8");

          const cargoVersion = updatedCargoToml.match(/\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m)?.[1];
          const cargoLockVersion = updatedCargoLock.match(/\[\[package\]\]\s*name\s*=\s*"avenil"\s*version\s*=\s*"([^"]+)"/m)?.[1];

          const versions = {
            tag: tagVersion,
            packageJson: packageJson.version,
            packageLock: packageLock.version,
            tauriConfig: tauriConfig.version,
            cargoToml: cargoVersion,
            cargoLock: cargoLockVersion,
          };

          const mismatches = Object.entries(versions)
            .filter(([, version]) => version !== tagVersion)
            .map(([source, version]) => `${source}=${version ?? "<missing>"}`);

          if (mismatches.length > 0) {
            throw new Error(
              `The release tag ${tag} does not match the app version. Expected ${tagVersion}; found ${mismatches.join(", ")}.`,
            );
          }

          console.log(`Prepared Avenil ${tagVersion} for macOS Apple Silicon.`);
          NODE

      - name: Build DMG
        uses: tauri-apps/tauri-action@v0.6.2
        with:
          tauriScript: npm run tauri
          args: --target aarch64-apple-darwin --bundles dmg
          includeUpdaterJson: false

      - name: Verify local DMG
        id: verify-dmg
        run: |
          dmg_path="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          if [ -z "$dmg_path" ]; then
            echo "The Tauri build did not produce a DMG for $TAG_NAME." >&2
            exit 1
          fi
          printf 'path=%s\n' "$dmg_path" >> "$GITHUB_OUTPUT"
          echo "Verified local DMG: $dmg_path"

      - name: Stage DMG for release publication
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ github.run_id }}
          path: ${{ steps.verify-dmg.outputs.path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Download staged DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg-${{ github.run_id }}
          path: release-artifact

      - name: Publish verified DMG
        run: |
          set -euo pipefail

          dmg_path="$(find release-artifact -type f -name '*.dmg' -print -quit)"
          if [ -z "$dmg_path" ]; then
            echo "The staged build does not contain a DMG for $TAG_NAME." >&2
            exit 1
          fi
          asset_name="$(basename "$dmg_path")"
          asset_name_encoded="$(printf '%s' "$asset_name" | jq -sRr @uri)"

          find_release() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -s --arg tag "$TAG_NAME" '[.[][] | select(.tag_name == $tag)] | first'
          }

          release_json="$(find_release)"
          if [ "$release_json" = "null" ] || [ -z "$release_json" ]; then
            release_notes=$'## Installation\n\n1. Download the `.dmg` asset below.\n2. Open it and drag Avenil to the Applications folder.\n3. Launch Avenil from Applications.\n\nAvenil requires macOS 15 or later on Apple Silicon.'
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "Avenil $TAG_NAME" \
              --notes "$release_notes" \
              --generate-notes
            release_json="$(find_release)"
          fi

          release_id="$(jq -r '.id' <<< "$release_json")"
          existing_asset="$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | [.state, (.size // 0)] | @tsv' <<< "$release_json")"
          if [ -n "$existing_asset" ]; then
            read -r existing_state existing_size <<< "$existing_asset"
            if [ "$existing_state" != "uploaded" ] || [ "$existing_size" -le 0 ]; then
              echo "The existing DMG asset is not complete: $asset_name (state=$existing_state, size=$existing_size)." >&2
              exit 1
            fi
            echo "DMG asset already exists; preserving the existing asset: $asset_name"
          else
            upload_url="$(jq -r '.upload_url' <<< "$release_json" | sed 's/{.*$//')"
            gh api --method POST \
              "${upload_url}?name=${asset_name_encoded}" \
              --header "Content-Type: application/octet-stream" \
              --input "$dmg_path" >/dev/null
            echo "Uploaded DMG asset: $asset_name"
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          if ! jq -e --arg name "$asset_name" '.assets | any(.name == $name and .state == "uploaded" and (.size // 0) > 0)' <<< "$release_json" >/dev/null; then
            echo "The GitHub Release does not contain the expected DMG asset: $asset_name" >&2
            exit 1
          fi

          if [ "$(jq -r '.draft' <<< "$release_json")" = "true" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F draft=false >/dev/null
          fi

          final_release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          jq -e --arg name "$asset_name" '.draft == false and any(.assets[]; .name == $name and .state == "uploaded" and (.size // 0) > 0)' <<< "$final_release_json" >/dev/null
          echo "Published GitHub Release $TAG_NAME with DMG asset $asset_name."
