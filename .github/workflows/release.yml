name: Release macOS app

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish DMG
    runs-on: macos-15
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release tag and app version
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const tag = process.env.TAG_NAME;
          const tagVersion = tag?.replace(/^v/, "");
          const semverPattern = /^v?\d+\.\d+\.\d+$/;

          if (!tag || !semverPattern.test(tag)) {
            throw new Error(`Release tags must use MAJOR.MINOR.PATCH with an optional v prefix: ${tag ?? "<missing>"}`);
          }

          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const packageLock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const tauriConfig = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
          const cargoToml = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargoToml.match(/\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m)?.[1];

          const versions = {
            tag: tagVersion,
            packageJson: packageJson.version,
            packageLock: packageLock.version,
            tauriConfig: tauriConfig.version,
            cargoToml: cargoVersion,
          };

          const mismatches = Object.entries(versions)
            .filter(([, version]) => version !== tagVersion)
            .map(([source, version]) => `${source}=${version ?? "<missing>"}`);

          if (mismatches.length > 0) {
            throw new Error(
              `The release tag ${tag} does not match the app version. Expected ${tagVersion}; found ${mismatches.join(", ")}.`,
            );
          }

          console.log(`Preparing Avenil ${tagVersion} for macOS Apple Silicon.`);
          NODE

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          args: --target aarch64-apple-darwin --bundles dmg
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: Avenil ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: |
            ## Installation

            1. Download the `.dmg` asset below.
            2. Open it and drag Avenil to the Applications folder.
            3. Launch Avenil from Applications.

            Avenil requires macOS 15 or later on Apple Silicon.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
